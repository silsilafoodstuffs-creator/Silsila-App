name: React Web POC Validation

on:
  pull_request:
    paths:
      - "web-react/**"
      - ".github/workflows/react-web-poc.yml"
  push:
    branches:
      - "architecture/hybrid-foundation"
    paths:
      - "web-react/**"
      - ".github/workflows/react-web-poc.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web-react
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web-react/package-lock.json
      - name: Install dependencies
        run: npm install
      - name: Run unit tests
        run: npm test
      - name: Build production bundle
        run: npm run build
