name: Silsila React Preview Validation
on:
  push:
    branches: [react-parallel-preview-2026-11-25]
    paths:
      - 'react-preview/**'
      - '.github/workflows/react-preview-validation.yml'
  pull_request:
    branches: [main]
    paths:
      - 'react-preview/**'
      - '.github/workflows/react-preview-validation.yml'
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: react-preview
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: silsila-react-preview-dist
          path: react-preview/dist
