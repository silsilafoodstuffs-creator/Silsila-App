name: Silsila React Preview Validation\non:\n  push:\n    branches: [react-parallel-preview-2026-11-25]\n    paths:\n      - 'react-preview/**'\n      - '.github/workflows/react-preview-validation.yml'\n  pull_request:\n    branches: [main]\n    paths:\n      - 'react-preview/**'\n      - '.github/workflows/react-preview-validation.yml'\n  workflow_dispatch:\njobs:\n  build:\n    runs-on: ubuntu-latest\n    defaults:\n      run:\n        working-directory: react-preview\n    steps:\n      - uses: actions/checkout@v4\n      - uses: actions/setup-node@v4\n        with:\n          node-version: 22\n          cache: npm\n          cache-dependency-path: react-preview/package-lock.json\n      - run: npm install\n      - run: npm run build\n      - uses: actions/upload-artifact@v4\n        with:\n          name: silsila-react-preview-dist\n          path: react-preview/dist\n