name: Silsila Full Validation - All Recent Changes

# Run the complete validation manually at planned milestones and final delivery.
on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'lib/erp/screens/erp_program_policies_screen.dart'
      - 'lib/erp/screens/erp_code_policy_panel.dart'
      - 'lib/erp/screens/**'
      - 'lib/erp/erp_dashboard_screen.dart'
      - 'lib/erp/screens/erp_hr_executive_dashboard_screen.dart'
      - 'lib/erp/screens/erp_inventory_master_screen.dart'
      - 'lib/erp/screens/erp_price_lists_screen.dart'
      - 'lib/erp/screens/erp_payroll_screen.dart'
      - 'lib/erp/screens/erp_inventory_screen.dart'
      - 'lib/erp/screens/erp_facebook_group_leads_screen.dart'
      - 'lib/erp/screens/erp_financial_operations_screen.dart'
      - 'lib/erp/screens/erp_operational_documents_screen.dart'
      - '.github/workflows/full-validation.yml'
      - 'supabase/migrations/*policy*codes*.sql'
      - 'supabase/migrations/*codes*program*policies*.sql'

permissions:
  contents: read

concurrency:
  group: silsila-full-validation
  # A newer main commit supersedes an older validation run; always validate the latest tree.
  cancel-in-progress: true

jobs:
  validate-all:
    name: Analyze, test, and build Android + Web
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout latest source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate catalog image importer and matching tests
        id: python_tests
        run: |
          python -m py_compile tools/catalog_import/import_real_product_images.py
          python -m unittest discover -s tools/catalog_import -p 'test_*.py' -v

      - name: Set up Flutter
        uses: subosito/flutter-action@fd55f4c5af5b953cc57a2be44cb082c8f6635e8e
        with:
          flutter-version: "3.29.3"
          cache: true

      - name: Generate supported Android platform project when missing
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f android/app/build.gradle.kts ] || [ ! -f android/gradlew ] || [ ! -f android/settings.gradle.kts ]; then
            flutter create --project-name=silsila_app --platforms=android .
          else
            echo "Existing Android project files detected; preserving them."
          fi

      - name: Configure Android NDK version required by plugins
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path("android/app/build.gradle.kts")
          if not p.exists():
              raise SystemExit("Android Gradle Kotlin file was not generated")
          source = p.read_text()
          version = 'ndkVersion = "27.0.12077973"'
          if version not in source:
              marker = "android {"
              if marker not in source:
                  raise SystemExit("Android configuration block not found")
              source = source.replace(marker, marker + "\n    " + version, 1)
              p.write_text(source)
          print("Configured Android NDK 27.0.12077973")
          PY

      - name: Resolve Flutter dependencies
        run: flutter pub get

      - name: Analyze all application and test Dart code
        id: analyze
        run: flutter analyze lib test --no-fatal-infos

      # Run independent checks even if analysis or another check fails.
      - name: Run all Flutter tests
        id: flutter_tests
        if: always() && !cancelled()
        run: flutter test

      - name: Build production-path web app with Dart source maps
        id: build_web
        if: always() && !cancelled()
        run: flutter build web --release --source-maps --base-href "/Silsila-App/"

      - name: Verify web build output
        id: verify_web
        if: always() && !cancelled() && steps.build_web.outcome == 'success'
        run: |
          set -euo pipefail
          test -s build/web/index.html
          test -s build/web/flutter_bootstrap.js
          grep -q 'flutter_bootstrap.js' build/web/index.html

      - name: Install Chromium browser test dependencies
        id: install_browser
        if: always() && !cancelled() && steps.build_web.outcome == 'success'
        run: |
          npm install --no-save --no-package-lock playwright source-map
          npx playwright install --with-deps chromium

      - name: Run real browser WebView tests (desktop + mobile)
        id: webview
        if: always() && !cancelled() && steps.verify_web.outcome == 'success' && steps.install_browser.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/silsila-web/Silsila-App
          cp -a build/web/. /tmp/silsila-web/Silsila-App/
          python3 -m http.server 8765 --directory /tmp/silsila-web >/tmp/silsila-web-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if curl --silent --fail http://127.0.0.1:8765/Silsila-App/ >/dev/null; then break; fi
            sleep 1
          done
          node tools/web_view_test.mjs http://127.0.0.1:8765/Silsila-App/

      # Keep Android build and artifact collection running even when WebView
      # fails, so one failed browser assertion does not hide other build results.
      - name: Build Android debug APK
        id: android_debug
        if: always() && !cancelled()
        run: flutter build apk --debug

      - name: Verify Android APK output
        id: verify_android
        if: always() && !cancelled() && steps.android_debug.outcome == 'success'
        run: test -s build/app/outputs/flutter-apk/app-debug.apk

      - name: Upload consolidated validation artifacts
        if: always() && !cancelled()
        uses: actions/upload-artifact@v4
        with:
          name: silsila-full-validation-${{ github.run_number }}
          path: |
            build/web/
            build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: warn
          retention-days: 7

      - name: Write consolidated validation summary
        if: always()
        shell: bash
        run: |
          status_icon() {
            case "$1" in
              success) echo "🟢 ناجح" ;;
              failure) echo "🔴 فاشل" ;;
              cancelled) echo "⚪ أُلغي" ;;
              skipped) echo "⚪ تم تخطيه" ;;
              *) echo "🟡 لم يُنفّذ / قيد الانتظار" ;;
            esac
          }
          {
            echo "## 🧪 Silsila Full Validation — نتيجة الاختبارات"
            echo ""
            echo "| الفحص | الحالة |"
            echo "|---|---|"
            echo "| اختبارات أدوات Python | $(status_icon '${{ steps.python_tests.outcome }}') |"
            echo "| تحليل Dart وFlutter | $(status_icon '${{ steps.analyze.outcome }}') |"
            echo "| اختبارات Flutter | $(status_icon '${{ steps.flutter_tests.outcome }}') |"
            echo "| بناء نسخة Web | $(status_icon '${{ steps.build_web.outcome }}') |"
            echo "| التحقق من ملفات Web | $(status_icon '${{ steps.verify_web.outcome }}') |"
            echo "| اختبار WebView — كمبيوتر وموبايل | $(status_icon '${{ steps.webview.outcome }}') |"
            echo "| بناء Android Debug APK | $(status_icon '${{ steps.android_debug.outcome }}') |"
            echo "| التحقق من ملف APK | $(status_icon '${{ steps.verify_android.outcome }}') |"
            echo ""
            echo "### معنى الألوان"
            echo "- 🟢 أخضر: الفحص نجح."
            echo "- 🔴 أحمر: الفحص فشل."
            echo "- 🟡 أصفر: لم يبدأ أو لم تتوفر نتيجة بعد."
            echo "- ⚪ رمادي: تم تخطي الفحص أو إلغاؤه."
          } >> "$GITHUB_STEP_SUMMARY"
