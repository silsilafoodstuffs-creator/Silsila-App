name: Silsila Web Preview Validation

on:
  workflow_run:
    workflows:
      - Silsila Web App Validation
    types:
      - completed
    branches: [main]
  pull_request:
    branches: [main]
    paths:
      - "lib/**"
      - "test/**"
      - "web/**"
      - "pubspec.yaml"
      - "pubspec.lock"
      - "assets/**"
      - "tools/web_view_test.mjs"
      - ".github/workflows/**"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

# Each validated build gets its own preview smoke run; pushes never cancel it.
concurrency:
  group: silsila-web-preview-validation-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  preview:
    if: ${{ github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout the exact validated source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Set up Flutter for feature preview
        if: ${{ github.event_name != 'workflow_run' }}
        uses: subosito/flutter-action@fd55f4c5af5b953cc57a2be44cb082c8f6635e8e
        with:
          flutter-version: "3.29.3"
          channel: stable
          cache: true

      - name: Resolve Flutter dependencies for feature preview
        if: ${{ github.event_name != 'workflow_run' }}
        run: flutter pub get

      - name: Build exact feature Web preview
        if: ${{ github.event_name != 'workflow_run' }}
        run: flutter build web --release --base-href "/Silsila-App/"

      - name: Download the exact production Web build
        if: ${{ github.event_name == 'workflow_run' }}
        uses: actions/download-artifact@v4
        with:
          name: silsila-web-build-${{ github.event.workflow_run.run_number }}
          path: build/web
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Cache Playwright Chromium
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-chromium-v1

      - name: Cache npm packages
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-playwright-${{ runner.os }}-v1

      - name: Install browser smoke-test dependencies
        run: |
          npm install --no-save --no-package-lock playwright source-map
          npx playwright install chromium

      - name: Run real desktop + mobile WebView smoke tests
        shell: bash
        run: |
          set -euo pipefail
          test -s build/web/index.html
          mkdir -p /tmp/silsila-web/Silsila-App
          cp -a build/web/. /tmp/silsila-web/Silsila-App/
          python3 -m http.server 8765 --directory /tmp/silsila-web >/tmp/silsila-web-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if curl --silent --fail http://127.0.0.1:8765/Silsila-App/ >/dev/null; then
              echo "Local Web Preview is responding."
              node tools/web_view_test.mjs http://127.0.0.1:8765/Silsila-App/
              exit 0
            fi
            sleep 1
          done
          cat /tmp/silsila-web-server.log
          exit 1
