name: Silsila Web Preview Validation

on:
  workflow_run:
    workflows:
      - Silsila Web Preview Deployment
    types:
      - completed
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Every deployed preview gets its own browser test run; never cancel it on a new push.
concurrency:
  group: silsila-web-preview-validation-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  preview:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout the exact deployed source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Cache Playwright Chromium
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-chromium-v1

      - name: Install browser smoke-test dependencies
        run: |
          npm install --no-save --no-package-lock playwright source-map
          npx playwright install --with-deps chromium

      - name: Wait for the deployed Web Preview to respond
        shell: bash
        run: |
          set -euo pipefail
          URL="https://silsilafoodstuffs-creator.github.io/Silsila-App/"
          for attempt in $(seq 1 30); do
            if curl --silent --show-error --fail "$URL" >/dev/null; then
              echo "Web Preview is responding."
              exit 0
            fi
            sleep 10
          done
          echo "Web Preview did not become available in time."
          exit 1

      - name: Run real desktop + mobile WebView smoke tests
        run: node tools/web_view_test.mjs https://silsilafoodstuffs-creator.github.io/Silsila-App/
