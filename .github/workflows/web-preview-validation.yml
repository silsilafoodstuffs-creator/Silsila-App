name: Silsila Web Preview Validation

on:
  workflow_run:
    workflows:
      - Silsila Web App Validation
    types:
      - completed
    branches: [main, 'feature/**']

permissions:
  contents: read
  actions: read

# Each validated build gets its own preview smoke run; pushes never cancel it.
concurrency:
  group: silsila-web-preview-validation-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  preview:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout the exact validated source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Download the exact production Web build
        uses: actions/download-artifact@v4
        with:
          name: silsila-web-build-${{ github.event.workflow_run.run_number }}
          path: build/web
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Cache Playwright Chromium
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-chromium-v1

      - name: Cache npm packages
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-playwright-${{ runner.os }}-v1

      - name: Install browser smoke-test dependencies
        run: |
          npm install --no-save --no-package-lock playwright source-map
          npx playwright install chromium

      - name: Serve the exact Web build as a local preview
        shell: bash
        run: |
          set -euo pipefail
          test -s build/web/index.html
          mkdir -p /tmp/silsila-web/Silsila-App
          cp -a build/web/. /tmp/silsila-web/Silsila-App/
          python3 -m http.server 8765 --directory /tmp/silsila-web >/tmp/silsila-web-server.log 2>&1 &
          SERVER_PID=$!
          echo "$SERVER_PID" > /tmp/silsila-web-server.pid
          for attempt in $(seq 1 30); do
            if curl --silent --fail http://127.0.0.1:8765/Silsila-App/ >/dev/null; then
              echo "Local Web Preview is responding."
              exit 0
            fi
            sleep 1
          done
          cat /tmp/silsila-web-server.log
          exit 1

      - name: Run real desktop + mobile WebView smoke tests
        run: node tools/web_view_test.mjs http://127.0.0.1:8765/Silsila-App/
