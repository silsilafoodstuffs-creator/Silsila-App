name: Silsila Web App Validation

on:
  push:
    branches: [main]
    paths:
      - "lib/**"
      - "test/**"
      - "web/**"
      - "pubspec.yaml"
      - "pubspec.lock"
      - "assets/**"
      - "tools/web_view_test.mjs"
  workflow_dispatch:

permissions:
  contents: read

# Separate from Android and Pages; active Web checks are not cancelled by pushes.
concurrency:
  group: silsila-web-validation-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  web:
    name: Build Web + desktop/mobile browser smoke
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout exact tested commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Set up Flutter
        uses: subosito/flutter-action@fd55f4c5af5b953cc57a2be44cb082c8f6635e8e
        with:
          flutter-version: "3.29.3"
          channel: stable
          cache: true

      - name: Resolve Flutter dependencies
        run: flutter pub get

      - name: Build production-path Web app
        run: flutter build web --release --source-maps --base-href "/Silsila-App/"

      - name: Verify Web build output
        run: |
          set -euo pipefail
          test -s build/web/index.html
          test -s build/web/flutter_bootstrap.js
          grep -q 'flutter_bootstrap.js' build/web/index.html
          grep -q 'سلسلة' build/web/index.html

      - name: Cache Playwright Chromium
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-chromium-v1

      - name: Install Chromium browser test dependencies
        run: |
          npm install --no-save --no-package-lock playwright source-map
          npx playwright install --with-deps chromium

      - name: Run local Web Preview smoke tests (desktop + mobile)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/silsila-web/Silsila-App
          cp -a build/web/. /tmp/silsila-web/Silsila-App/
          python3 -m http.server 8765 --directory /tmp/silsila-web >/tmp/silsila-web-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if curl --silent --fail http://127.0.0.1:8765/Silsila-App/ >/dev/null; then break; fi
            sleep 1
          done
          node tools/web_view_test.mjs http://127.0.0.1:8765/Silsila-App/

      - name: Upload Web build
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: silsila-web-build-${{ github.run_number }}
          path: build/web/
          if-no-files-found: warn
          retention-days: 7
