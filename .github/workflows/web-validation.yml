name: Silsila Web App Validation

on:
  pull_request:
    branches: [main]
    paths:
      - "lib/**"
      - "test/**"
      - "integration_test/**"
      - "android/**"
      - "web/**"
      - "pubspec.yaml"
      - "pubspec.lock"
      - "assets/**"
      - "supabase/**"
      - ".github/workflows/**"
  push:
    branches: [main]
    paths:
      - "lib/**"
      - "test/**"
      - "web/**"
      - "pubspec.yaml"
      - "pubspec.lock"
      - "assets/**"
      - "supabase/**"
      - "tools/web_view_test.mjs"
      - ".github/workflows/**"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Keep one current Web validation per branch.
concurrency:
  group: silsila-web-validation-${{ github.ref }}
  cancel-in-progress: false

jobs:
  web:
    name: Build Web + verify production artifact
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout exact tested commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Set up Flutter
        uses: subosito/flutter-action@fd55f4c5af5b953cc57a2be44cb082c8f6635e8e
        with:
          flutter-version: "3.29.3"
          channel: stable
          cache: true

      - name: Cache Dart and Flutter packages
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: flutter-pub-${{ runner.os }}-${{ hashFiles('pubspec.lock') }}
          restore-keys: |
            flutter-pub-${{ runner.os }}-

      - name: Resolve Flutter dependencies
        run: flutter pub get

      - name: Analyze all application and test Dart code
        run: flutter analyze lib test --no-fatal-infos --no-fatal-warnings

      - name: Run the complete Flutter test suite
        run: flutter test --reporter expanded

      - name: Build production-path Web app without offline-first PWA caching
        run: flutter build web --release --pwa-strategy=none --base-href "/Silsila-App/"

      - name: Stamp the Web bootstrap with the exact commit
        shell: bash
        run: |
          set -euo pipefail
          test -s build/web/index.html
          sed -i "s/__SILSILA_BUILD_VERSION__/${GITHUB_SHA}/g" build/web/index.html
          grep -q "flutter_bootstrap.js?v=${GITHUB_SHA}" build/web/index.html
          # The loader references the compiled Dart entrypoint by a stable
          # filename; add the same release key so mobile browsers cannot reuse
          # a previous main.dart.js from their HTTP cache.
          if grep -q "main.dart.js" build/web/flutter_bootstrap.js; then
            sed -i "s/main.dart.js/main.dart.js?v=${GITHUB_SHA}/g" build/web/flutter_bootstrap.js
          else
            echo "ERROR: Flutter bootstrap does not reference main.dart.js as expected."
            exit 1
          fi

      - name: Verify Web build output
        run: |
          set -euo pipefail
          test -s build/web/index.html
          test -s build/web/flutter_bootstrap.js
          grep -q 'flutter_bootstrap.js' build/web/index.html
          grep -q 'سلسلة' build/web/index.html

      - name: Install Chromium browser test dependencies
        run: |
          npm install --no-save --no-package-lock playwright source-map
          npx playwright install chromium

      - name: Test Silsila Web in desktop and mobile browser viewports
        id: mobile_webview
        timeout-minutes: 15
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/silsila-web/Silsila-App
          cp -a build/web/. /tmp/silsila-web/Silsila-App/
          python3 -m http.server 8765 --directory /tmp/silsila-web >/tmp/silsila-web-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if curl --silent --fail http://127.0.0.1:8765/Silsila-App/ >/dev/null; then break; fi
            sleep 1
          done
          node tools/web_view_test.mjs http://127.0.0.1:8765/Silsila-App/

      - name: Write desktop + mobile browser test summary
        if: always()
        shell: bash
        run: |
          {
            echo "## Silsila Web — Browser Viewport Validation"
            echo ""
            echo "| Viewport | Result |"
            echo "|---|---|"
            echo "| Desktop Chromium | ${{ steps.mobile_webview.outcome }} |"
            echo "| Mobile Chromium (390×844) | ${{ steps.mobile_webview.outcome }} |"
            echo ""
            echo "The browser test checks Flutter canvas rendering, page errors, failed requests, bootstrap versioning, and stale offline caches."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Web build
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: silsila-web-build-${{ github.run_number }}
          path: build/web/
          if-no-files-found: warn
          retention-days: 7

  deploy-github-pages:
    name: Publish the validated build to the permanent GitHub Pages URL
    needs: web
    if: ${{ success() && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Download this run's validated Web build
        uses: actions/download-artifact@v4
        with:
          name: silsila-web-build-${{ github.run_number }}
          path: build/web

      - name: Verify Web artifact before publishing
        run: |
          set -euo pipefail
          test -s build/web/index.html
          test -s build/web/flutter_bootstrap.js

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          name: silsila-pages-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/web

      - name: Publish the permanent Silsila URL
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: silsila-pages-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Verify the permanent URL responds
        shell: bash
        run: |
          set -euo pipefail
          URL="https://silsilafoodstuffs-creator.github.io/Silsila-App/"
          for attempt in $(seq 1 30); do
            if curl --silent --show-error --fail "$URL" >/dev/null; then
              echo "The permanent GitHub Pages URL is responding."
              exit 0
            fi
            sleep 10
          done
          echo "The permanent GitHub Pages URL did not respond in time."
          exit 1
