name: Silsila Web App Validation

on:
  pull_request:
    branches: [main]
    paths:
      - "lib/**"
      - "test/**"
      - "integration_test/**"
      - "android/**"
      - "web/**"
      - "pubspec.yaml"
      - "pubspec.lock"
      - "assets/**"
      - "supabase/**"
      - ".github/workflows/**"
  push:
    branches: [main]
    paths:
      - "lib/**"
      - "test/**"
      - "web/**"
      - "pubspec.yaml"
      - "pubspec.lock"
      - "assets/**"
      - "supabase/**"
      - "tools/web_view_test.mjs"
      - ".github/workflows/**"
  workflow_dispatch:

permissions:
  contents: read

# Isolate each commit's validation so later pushes cannot cancel an active test.
concurrency:
  group: silsila-web-validation-${{ github.sha }}
  cancel-in-progress: false

jobs:
  web:
    name: Build Web + verify production artifact
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout exact tested commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Set up Flutter
        uses: subosito/flutter-action@fd55f4c5af5b953cc57a2be44cb082c8f6635e8e
        with:
          flutter-version: "3.29.3"
          channel: stable
          cache: true

      - name: Cache Dart and Flutter packages
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: flutter-pub-${{ runner.os }}-${{ hashFiles('pubspec.lock') }}
          restore-keys: |
            flutter-pub-${{ runner.os }}-

      - name: Resolve Flutter dependencies
        run: flutter pub get

      - name: Build production-path Web app without offline-first PWA caching
        run: flutter build web --release --pwa-strategy=none --base-href "/Silsila-App/"

      - name: Stamp the Web bootstrap with the exact commit
        shell: bash
        run: |
          set -euo pipefail
          test -s build/web/index.html
          sed -i "s/__SILSILA_BUILD_VERSION__/${GITHUB_SHA}/g" build/web/index.html
          grep -q "flutter_bootstrap.js?v=${GITHUB_SHA}" build/web/index.html
          # The loader references the compiled Dart entrypoint by a stable
          # filename; add the same release key so mobile browsers cannot reuse
          # a previous main.dart.js from their HTTP cache.
          if grep -q "main.dart.js" build/web/flutter_bootstrap.js; then
            sed -i "s/main.dart.js/main.dart.js?v=${GITHUB_SHA}/g" build/web/flutter_bootstrap.js
          else
            echo "ERROR: Flutter bootstrap does not reference main.dart.js as expected."
            exit 1
          fi

      - name: Verify Web build output
        run: |
          set -euo pipefail
          test -s build/web/index.html
          test -s build/web/flutter_bootstrap.js
          grep -q 'flutter_bootstrap.js' build/web/index.html
          grep -q 'سلسلة' build/web/index.html

      - name: Upload Web build
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: silsila-web-build-${{ github.run_number }}
          path: build/web/
          if-no-files-found: warn
          retention-days: 7
