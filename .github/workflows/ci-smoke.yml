name: Silsila CI Smoke Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: silsila-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  flutter-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test catalog image matching safety
        run: |
          python -m py_compile tools/catalog_import/import_real_product_images.py
          python -m unittest discover -s tools/catalog_import -p 'test_*.py' -v
      - name: Set up Flutter
        uses: subosito/flutter-action@fd55f4c5af5b953cc57a2be44cb082c8f6635e8e
        with:
          flutter-version: '3.29.3'
          cache: true
      - name: Verify Flutter project metadata
        run: flutter --version && test -f pubspec.yaml
      - name: Resolve dependencies
        run: flutter pub get
      - name: Analyze Dart source
        run: flutter analyze lib test
      - name: Run automated tests
        run: flutter test
