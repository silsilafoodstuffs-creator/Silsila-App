name: Build Silsila Android App

# Keep the signed production APK as an intentional manual release task.
# Routine mobile validation already builds and verifies a debug APK on every relevant change.
concurrency:
  group: silsila-android-release-${{ github.run_id }}
  cancel-in-progress: false

'on':
  # Build the signed production APK when this release workflow itself is updated.
  # This allows a maintainer-approved release configuration change to produce an artifact
  # without requiring a separate debug APK path.
  push:
    branches: [main]
    paths:
      - ".github/workflows/build.yml"
  workflow_dispatch:
    inputs:
      test_login:
        description: 'Enable direct login for the two designated test accounts (testing only)'
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Download validated project
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Locate Flutter project
        run: |
          pwd
          ls -la
          find . -name pubspec.yaml -not -path '*/.dart_tool/*'

      - name: Install Flutter
        uses: subosito/flutter-action@fd55f4c5af5b953cc57a2be44cb082c8f6635e8e
        with:
          flutter-version: '3.29.3'
          cache: true

      - name: Set up Java 17 for Android Gradle
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Cache Gradle dependencies
        uses: gradle/actions/setup-gradle@v4

      - name: Generate only missing Flutter platform files
        shell: bash
        run: |
          set -euo pipefail
          had_widget_test=false
          if [ -f test/widget_test.dart ]; then had_widget_test=true; fi

          if [ ! -f android/app/build.gradle.kts ] || [ ! -f android/gradlew ]; then
            flutter create --project-name=silsila_app --platforms=android .
          else
            echo "Existing Android project files preserved."
          fi

          if [ ! -f web/index.html ]; then
            flutter create --project-name=silsila_app --platforms=web .
          else
            echo "Existing web/index.html preserved; no Flutter web template regeneration."
          fi

          if [ "$had_widget_test" = false ] && [ -f test/widget_test.dart ] && ! git ls-files --error-unmatch test/widget_test.dart >/dev/null 2>&1; then
            rm test/widget_test.dart
            echo "Removed only the untracked default Flutter sample test generated by flutter create."
          fi

      - name: Ensure Android internet permission
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("android/app/src/main/AndroidManifest.xml")
          s = p.read_text()

          permission = 'android.permission.INTERNET'

          if permission not in s:
              marker = s.find('>', s.find('<manifest'))
              if marker == -1:
                  raise SystemExit("ERROR: Manifest tag not found")

              s = (
                  s[:marker + 1]
                  + '\n    <uses-permission android:name="android.permission.INTERNET" />'
                  + s[marker + 1:]
              )
              p.write_text(s)

          print("SUCCESS: Android internet permission is present")
          PY

      - name: Get dependencies
        run: |
          flutter pub get

      - name: Generate and verify Silsila App Icon sources
        run: |
          set -euo pipefail
          dart run flutter_launcher_icons
          echo "Generated launcher resources:"
          find android/app/src/main/res -maxdepth 2 -type f -iname '*launcher*' -print | sort
          test -s android/app/src/main/res/mipmap-mdpi/ic_launcher.png
          test -s android/app/src/main/res/mipmap-hdpi/ic_launcher.png
          test -s android/app/src/main/res/mipmap-xhdpi/ic_launcher.png
          test -s android/app/src/main/res/mipmap-xxhdpi/ic_launcher.png
          test -s android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png

      - name: Configure permanent signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          set -e
          test -n "$ANDROID_KEYSTORE_BASE64"
          test -n "$ANDROID_KEYSTORE_PASSWORD"

          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/silsila-upload-key.jks

          cat > android/key.properties <<EOF
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyPassword=$ANDROID_KEYSTORE_PASSWORD
          keyAlias=silsila
          storeFile=silsila-upload-key.jks
          EOF

          python3 - <<'PY'
          from pathlib import Path

          p = Path("android/app/build.gradle.kts")
          if not p.exists():
              raise SystemExit("Kotlin Gradle file not found")

          s = p.read_text()

          imports = (
              "import java.util.Properties\n"
              "import java.io.FileInputStream\n"
          )
          if "import java.util.Properties" not in s:
              s = imports + s

          if 'ndkVersion = "27.0.12077973"' not in s:
              s = s.replace("android {", 'android {\n    ndkVersion = "27.0.12077973"', 1)

          props = """
          val keystoreProperties = Properties()
          val keystorePropertiesFile = rootProject.file("key.properties")
          if (keystorePropertiesFile.exists()) {
              keystoreProperties.load(FileInputStream(keystorePropertiesFile))
          }

          """
          if "val keystoreProperties = Properties()" not in s:
              marker = "android {"
              if marker not in s:
                  raise SystemExit("Android configuration not found")
              s = s.replace(marker, props + marker, 1)

          signing = """
              signingConfigs {
                  create("release") {
                      keyAlias = keystoreProperties["keyAlias"] as String
                      keyPassword = keystoreProperties["keyPassword"] as String
                      storeFile = file(keystoreProperties["storeFile"] as String)
                      storePassword = keystoreProperties["storePassword"] as String
                  }
              }

          """
          if 'create("release")' not in s:
              marker = "    buildTypes {"
              if marker not in s:
                  raise SystemExit("Build types configuration not found")
              s = s.replace(marker, signing + marker, 1)

          debug = 'signingConfig = signingConfigs.getByName("debug")'
          release = 'signingConfig = signingConfigs.getByName("release")'

          if debug in s:
              s = s.replace(debug, release, 1)
          elif release not in s:
              raise SystemExit("Could not configure release signing")

          p.write_text(s)
          print("Permanent signing configuration prepared")
          PY

      - name: Test catalog image matching
        run: python3 -m unittest tools/catalog_import/test_import_real_product_images.py -v

      - name: Check code
        run: flutter analyze lib test --no-fatal-infos --no-fatal-warnings

      - name: Build Android APK
        run: |
          flutter build apk --release --dart-define=SILSILA_TEST_LOGIN=${{ github.event_name == 'workflow_dispatch' && inputs.test_login || false }}

      - name: Verify APK signature
        shell: bash
        run: |
          set -euo pipefail

          APK="build/app/outputs/flutter-apk/app-release.apk"
          SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          APKSIGNER="$(find "$SDK/build-tools" -name apksigner -type f | sort -V | tail -n 1)"

          if [ -z "$APKSIGNER" ]; then
            echo "ERROR: apksigner not found"
            exit 1
          fi

          OUTPUT="$("$APKSIGNER" verify --verbose --print-certs "$APK")"
          printf '%s\n' "$OUTPUT"

          ACTUAL="$(printf '%s\n' "$OUTPUT" | sed -n 's/.*certificate SHA-256 digest: *//Ip' | head -n 1 | tr -d ':' | tr '[:upper:]' '[:lower:]')"
          EXPECTED="a69301fe3009183301d1751aa99ef8d9025c696e2870e4dfb5fd9732be4d8e42"

          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "ERROR: APK certificate does not match the permanent signing certificate"
            exit 1
          fi

          echo "SUCCESS: APK signature matches the permanent signing certificate"

      - name: Verify APK identity, version, and launcher icon
        shell: bash
        run: |
          set -euo pipefail
          APK="build/app/outputs/flutter-apk/app-release.apk"
          SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          APKANALYZER="$SDK/cmdline-tools/latest/bin/apkanalyzer"
          if [ ! -x "$APKANALYZER" ]; then
            APKANALYZER="$(find "$SDK/cmdline-tools" "$SDK/build-tools" -name apkanalyzer -type f -print -quit 2>/dev/null || true)"
          fi
          if [ -z "$APKANALYZER" ]; then
            echo "ERROR: apkanalyzer was not found"
            exit 1
          fi

          APP_ID="$("$APKANALYZER" manifest application-id "$APK")"
          VERSION_CODE="$("$APKANALYZER" manifest version-code "$APK")"
          VERSION_NAME="$("$APKANALYZER" manifest version-name "$APK")"
          echo "APK applicationId: $APP_ID"
          echo "APK versionName: $VERSION_NAME"
          echo "APK versionCode: $VERSION_CODE"

          EXPECTED_APP_ID="com.example.silsila_app"
          if [ "$APP_ID" != "$EXPECTED_APP_ID" ]; then
            echo "ERROR: APK applicationId changed. Expected $EXPECTED_APP_ID, got $APP_ID"
            exit 1
          fi
          test "$VERSION_CODE" -ge 2

          AAPT="$(find "$SDK/build-tools" -name aapt -type f | sort -V | tail -n 1)"
          if [ -z "$AAPT" ]; then
            echo "ERROR: aapt was not found in the Android SDK build-tools"
            exit 1
          fi

          echo "Compiled launcher resources:"
          RESOURCE_DUMP="$("$AAPT" dump resources "$APK")"
          printf '%s\n' "$RESOURCE_DUMP" | grep -E 'mipmap/ic_launcher(_foreground)?' || true
          if ! printf '%s\n' "$RESOURCE_DUMP" | grep -Fq 'mipmap/ic_launcher'; then
            echo "ERROR: Compiled APK resource table does not contain mipmap/ic_launcher"
            exit 1
          fi
          echo "SUCCESS: APK applicationId, version code, and compiled launcher resource verified"

      - name: Save APK
        uses: actions/upload-artifact@v4
        with:
          name: silsila-android-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
