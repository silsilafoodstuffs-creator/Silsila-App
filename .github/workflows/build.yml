name: Build Silsila Android App

'on':
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Download project
        uses: actions/checkout@v4

      
      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.3'
          cache: true


      - name: Generate Flutter platform files
        run: flutter create --project-name=silsila_app --platforms=android,web .

      - name: Verify Android files
        run: |
          pwd
          ls -la
          flutter create --project-name=silsila_app --platforms=android .
          test -f android/app/build.gradle.kts || test -f android/app/build.gradle
          echo "Android files generated successfully"

      - name: Get dependencies
        run: flutter pub get


      - name: Check code
        run: flutter analyze lib

      - name: Build Android APK
        run: flutter build apk --release

      - name: Save APK
        uses: actions/upload-artifact@v4
        with:
          name: silsila-android-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
