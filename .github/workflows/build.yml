name: Build Silsila Android App

# Keep only the newest release build for a branch; older commits are superseded.
concurrency:
  group: silsila-android-release-${{ github.ref }}
  cancel-in-progress: true

'on':
  # Build a signed production APK whenever shipped app code, assets, dependencies,
  # database migrations, or this release workflow changes.
  push:
    branches: [main]
    paths:
      - ".github/workflows/build.yml"
      - "lib/**"
      - "assets/**"
      - "pubspec.yaml"
      - "pubspec.lock"
      - "android/**"
      - "supabase/migrations/**"
      - "tools/prepare_android_release.sh"
  workflow_dispatch:
    inputs:
      test_login:
        description: 'Enable direct login for the two designated test accounts (testing only)'
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Download validated project
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Locate Flutter project
        run: |
          pwd
          ls -la
          find . -name pubspec.yaml -not -path '*/.dart_tool/*'

      - name: Install Flutter
        uses: subosito/flutter-action@fd55f4c5af5b953cc57a2be44cb082c8f6635e8e
        with:
          flutter-version: '3.29.3'
          cache: true

      - name: Set up Java 17 for Android Gradle
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Cache Gradle dependencies
        uses: gradle/actions/setup-gradle@v4

      - name: Generate only missing Flutter platform files
        shell: bash
        run: |
          set -euo pipefail
          had_widget_test=false
          if [ -f test/widget_test.dart ]; then had_widget_test=true; fi

          if [ ! -f android/app/build.gradle.kts ] || [ ! -f android/gradlew ]; then
            flutter create --project-name=silsila_app --platforms=android .
          else
            echo "Existing Android project files preserved."
          fi

          if [ ! -f web/index.html ]; then
            flutter create --project-name=silsila_app --platforms=web .
          else
            echo "Existing web/index.html preserved; no Flutter web template regeneration."
          fi

          if [ "$had_widget_test" = false ] && [ -f test/widget_test.dart ] && ! git ls-files --error-unmatch test/widget_test.dart >/dev/null 2>&1; then
            rm test/widget_test.dart
            echo "Removed only the untracked default Flutter sample test generated by flutter create."
          fi

      - name: Ensure Android internet permission
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("android/app/src/main/AndroidManifest.xml")
          s = p.read_text()

          permission = 'android.permission.INTERNET'

          if permission not in s:
              marker = s.find('>', s.find('<manifest'))
              if marker == -1:
                  raise SystemExit("ERROR: Manifest tag not found")

              s = (
                  s[:marker + 1]
                  + '\n    <uses-permission android:name="android.permission.INTERNET" />'
                  + s[marker + 1:]
              )
              p.write_text(s)

          print("SUCCESS: Android internet permission is present")
          PY

      - name: Get dependencies
        run: |
          flutter pub get

      - name: Prepare signed Release APK and Silsila launcher icon
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: bash tools/prepare_android_release.sh

      - name: Test catalog image matching
        run: python3 -m unittest tools/catalog_import/test_import_real_product_images.py -v

      - name: Check code
        run: flutter analyze lib test --no-fatal-infos --no-fatal-warnings

      - name: Build Android APK
        run: |
          flutter build apk --release --dart-define=SILSILA_TEST_LOGIN=${{ github.event_name == 'workflow_dispatch' && inputs.test_login || false }}

      - name: Verify APK signature
        shell: bash
        run: |
          set -euo pipefail

          APK="build/app/outputs/flutter-apk/app-release.apk"
          SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          APKSIGNER="$(find "$SDK/build-tools" -name apksigner -type f | sort -V | tail -n 1)"

          if [ -z "$APKSIGNER" ]; then
            echo "ERROR: apksigner not found"
            exit 1
          fi

          OUTPUT="$("$APKSIGNER" verify --verbose --print-certs "$APK")"
          printf '%s\n' "$OUTPUT"

          ACTUAL="$(printf '%s\n' "$OUTPUT" | sed -n 's/.*certificate SHA-256 digest: *//Ip' | head -n 1 | tr -d ':' | tr '[:upper:]' '[:lower:]')"
          EXPECTED="a69301fe3009183301d1751aa99ef8d9025c696e2870e4dfb5fd9732be4d8e42"

          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "ERROR: APK certificate does not match the permanent signing certificate"
            exit 1
          fi

          echo "SUCCESS: APK signature matches the permanent signing certificate"

      - name: Verify APK identity, version, and launcher icon
        shell: bash
        run: |
          set -euo pipefail
          APK="build/app/outputs/flutter-apk/app-release.apk"
          SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          APKANALYZER="$SDK/cmdline-tools/latest/bin/apkanalyzer"
          if [ ! -x "$APKANALYZER" ]; then
            APKANALYZER="$(find "$SDK/cmdline-tools" "$SDK/build-tools" -name apkanalyzer -type f -print -quit 2>/dev/null || true)"
          fi
          if [ -z "$APKANALYZER" ]; then
            echo "ERROR: apkanalyzer was not found"
            exit 1
          fi

          APP_ID="$("$APKANALYZER" manifest application-id "$APK")"
          VERSION_CODE="$("$APKANALYZER" manifest version-code "$APK")"
          VERSION_NAME="$("$APKANALYZER" manifest version-name "$APK")"
          echo "APK applicationId: $APP_ID"
          echo "APK versionName: $VERSION_NAME"
          echo "APK versionCode: $VERSION_CODE"

          EXPECTED_APP_ID="com.example.silsila_app"
          if [ "$APP_ID" != "$EXPECTED_APP_ID" ]; then
            echo "ERROR: APK applicationId changed. Expected $EXPECTED_APP_ID, got $APP_ID"
            exit 1
          fi
          test "$VERSION_CODE" -ge 5

          AAPT="$(find "$SDK/build-tools" -name aapt -type f | sort -V | tail -n 1)"
          if [ -z "$AAPT" ]; then
            echo "ERROR: aapt was not found in the Android SDK build-tools"
            exit 1
          fi

          echo "Resolved launcher icon from APK manifest:"
          BADGING="$("$AAPT" dump badging "$APK")"
          printf '%s\n' "$BADGING" | grep -E '^application-icon-[0-9]+:' || true
          if ! printf '%s\n' "$BADGING" | grep -Eq '^application-icon-[0-9]+:'; then
            echo "ERROR: APK manifest does not resolve a compiled application launcher icon"
            exit 1
          fi
          echo "SUCCESS: APK applicationId, version code, and manifest-resolved launcher icon verified"

      - name: Save APK
        uses: actions/upload-artifact@v4
        with:
          name: silsila-android-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
