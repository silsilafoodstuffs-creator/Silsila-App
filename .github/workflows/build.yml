name: Build Silsila Android App

'on':
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      test_login:
        description: 'Enable direct login for the two designated test accounts (testing only)'
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  build-android:
    if: ${{ github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest

    steps:
      - name: Download project
        uses: actions/checkout@v4

      - name: Locate Flutter project
        run: |
          pwd
          ls -la
          find . -name pubspec.yaml -not -path '*/.dart_tool/*'

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.3'
          cache: true

      - name: Generate only missing Flutter platform files
        shell: bash
        run: |
          set -euo pipefail
          had_widget_test=false
          if [ -f test/widget_test.dart ]; then had_widget_test=true; fi

          if [ ! -f android/app/build.gradle.kts ] || [ ! -f android/gradlew ]; then
            flutter create --project-name=silsila_app --platforms=android .
          else
            echo "Existing Android project files preserved."
          fi

          if [ ! -f web/index.html ]; then
            flutter create --project-name=silsila_app --platforms=web .
          else
            echo "Existing web/index.html preserved; no Flutter web template regeneration."
          fi

          if [ "$had_widget_test" = false ] && [ -f test/widget_test.dart ] && ! git ls-files --error-unmatch test/widget_test.dart >/dev/null 2>&1; then
            rm test/widget_test.dart
            echo "Removed only the untracked default Flutter sample test generated by flutter create."
          fi

      - name: Ensure Android internet permission
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("android/app/src/main/AndroidManifest.xml")
          s = p.read_text()

          permission = 'android.permission.INTERNET'

          if permission not in s:
              marker = s.find('>', s.find('<manifest'))
              if marker == -1:
                  raise SystemExit("ERROR: Manifest tag not found")

              s = (
                  s[:marker + 1]
                  + '\n    <uses-permission android:name="android.permission.INTERNET" />'
                  + s[marker + 1:]
              )
              p.write_text(s)

          print("SUCCESS: Android internet permission is present")
          PY

      - name: Get dependencies
        run: |
          flutter pub get
          flutter pub deps

      - name: Generate Silsila App Icon
        run: dart run flutter_launcher_icons

      - name: Configure permanent signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          set -e
          test -n "$ANDROID_KEYSTORE_BASE64"
          test -n "$ANDROID_KEYSTORE_PASSWORD"

          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/silsila-upload-key.jks

          cat > android/key.properties <<EOF
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyPassword=$ANDROID_KEYSTORE_PASSWORD
          keyAlias=silsila
          storeFile=silsila-upload-key.jks
          EOF

          python3 - <<'PY'
          from pathlib import Path

          p = Path("android/app/build.gradle.kts")
          if not p.exists():
              raise SystemExit("Kotlin Gradle file not found")

          s = p.read_text()

          imports = (
              "import java.util.Properties\n"
              "import java.io.FileInputStream\n"
          )
          if "import java.util.Properties" not in s:
              s = imports + s

          if 'ndkVersion = "27.0.12077973"' not in s:
              s = s.replace("android {", 'android {\n    ndkVersion = "27.0.12077973"', 1)

          props = """
          val keystoreProperties = Properties()
          val keystorePropertiesFile = rootProject.file("key.properties")
          if (keystorePropertiesFile.exists()) {
              keystoreProperties.load(FileInputStream(keystorePropertiesFile))
          }

          """
          if "val keystoreProperties = Properties()" not in s:
              marker = "android {"
              if marker not in s:
                  raise SystemExit("Android configuration not found")
              s = s.replace(marker, props + marker, 1)

          signing = """
              signingConfigs {
                  create("release") {
                      keyAlias = keystoreProperties["keyAlias"] as String
                      keyPassword = keystoreProperties["keyPassword"] as String
                      storeFile = file(keystoreProperties["storeFile"] as String)
                      storePassword = keystoreProperties["storePassword"] as String
                  }
              }

          """
          if 'create("release")' not in s:
              marker = "    buildTypes {"
              if marker not in s:
                  raise SystemExit("Build types configuration not found")
              s = s.replace(marker, signing + marker, 1)

          debug = 'signingConfig = signingConfigs.getByName("debug")'
          release = 'signingConfig = signingConfigs.getByName("release")'

          if debug in s:
              s = s.replace(debug, release, 1)
          elif release not in s:
              raise SystemExit("Could not configure release signing")

          p.write_text(s)
          print("Permanent signing configuration prepared")
          PY

      - name: Check code
        run: flutter analyze lib --no-fatal-infos

      - name: Build Android APK
        run: |
          flutter build apk --release --dart-define=SILSILA_TEST_LOGIN=${{ inputs.test_login }}

      - name: Verify APK signature
        shell: bash
        run: |
          set -euo pipefail

          APK="build/app/outputs/flutter-apk/app-release.apk"
          SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          APKSIGNER="$(find "$SDK/build-tools" -name apksigner -type f | sort -V | tail -n 1)"

          if [ -z "$APKSIGNER" ]; then
            echo "ERROR: apksigner not found"
            exit 1
          fi

          OUTPUT="$("$APKSIGNER" verify --verbose --print-certs "$APK")"
          printf '%s\n' "$OUTPUT"

          ACTUAL="$(printf '%s\n' "$OUTPUT" | sed -n 's/.*certificate SHA-256 digest: *//Ip' | head -n 1 | tr -d ':' | tr '[:upper:]' '[:lower:]')"
          EXPECTED="a69301fe3009183301d1751aa99ef8d9025c696e2870e4dfb5fd9732be4d8e42"

          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "ERROR: APK certificate does not match the permanent signing certificate"
            exit 1
          fi

          echo "SUCCESS: APK signature matches the permanent signing certificate"

      - name: Check APK package ID
        run: |
          APK="build/app/outputs/flutter-apk/app-release.apk"
          SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          APKANALYZER="$(find "$SDK" -name apkanalyzer -type f | head -n 1)"
          if [ -z "$APKANALYZER" ]; then
            echo "apkanalyzer was not found"
            exit 1
          fi
          "$APKANALYZER" manifest application-id "$APK"

      - name: Save APK
        uses: actions/upload-artifact@v4
        with:
          name: silsila-android-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

      - name: Build ERP web dashboard
        run: flutter build web --release

      - name: Save ERP web dashboard
        uses: actions/upload-artifact@v4
        with:
          name: silsila-erp-web
          path: build/web/
          if-no-files-found: error

  android-smoke:
    if: ${{ github.event_name != 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.3'
          cache: true

      - name: Generate missing Android platform files
        shell: bash
        run: |
          set -euo pipefail
          had_widget_test=false
          if [ -f test/widget_test.dart ]; then had_widget_test=true; fi

          if [ ! -f android/app/build.gradle.kts ] || [ ! -f android/gradlew ]; then
            flutter create --project-name=silsila_app --platforms=android .
          else
            echo "Existing Android project files preserved."
          fi

          if [ "$had_widget_test" = false ] && [ -f test/widget_test.dart ] && ! git ls-files --error-unmatch test/widget_test.dart >/dev/null 2>&1; then
            rm test/widget_test.dart
            echo "Removed only the untracked default Flutter sample test generated by flutter create."
          fi

      - name: Resolve dependencies
        run: flutter pub get

      - name: Analyze Dart source
        run: flutter analyze lib --no-fatal-infos

      - name: Run automated tests
        run: flutter test

      - name: Build Android debug APK
        run: flutter build apk --debug

      - name: Save Android debug APK
        uses: actions/upload-artifact@v4
        with:
          name: silsila-android-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
