name: Import real category photographs
on:
  push:
    branches: [main]
    paths:
      - "tools/category_images/import_real_category_images.py"
      - ".github/workflows/import-real-category-images.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: silsila-real-category-photo-import
  cancel-in-progress: false

jobs:
  import-category-photos:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install HTTP client
        run: python -m pip install --disable-pip-version-check requests==2.32.4
      - name: Import real photos and license attribution into Supabase
        env:
          SUPABASE_URL: https://teitsopmhruczplwlwgn.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SILSILA_ERP_COMPANY_ID: 47278c99-7743-4dd4-9ce6-d11f28e02504
        run: |
          python -m py_compile tools/category_images/import_real_category_images.py
          python tools/category_images/import_real_category_images.py
