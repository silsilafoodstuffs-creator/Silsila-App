name: Deploy Silsila ERP Web Preview

'on':
  push:
    branches:
      - main
    paths:
      - 'lib/**'
      - 'web/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - '.github/workflows/deploy-erp-web.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: silsila-erp-pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.3'
          channel: stable
          cache: true

      - name: Generate Flutter web files only when missing
        shell: bash
        run: |
          if [ ! -f web/index.html ]; then
            flutter create --project-name=silsila_app --platforms=web .
          else
            echo "Existing web files preserved; no Flutter web template regeneration."
          fi

      - name: Get dependencies
        run: flutter pub get

      - name: Build ERP web preview
        run: flutter build web --release --base-href "/Silsila-App/"

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload web build
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

      - name: Deploy web preview
        id: deployment
        uses: actions/deploy-pages@v4
