name: Build Silsila ERP Web Preview

# The production Pages site is deployed by deploy.yml.
# Build a downloadable ERP web artifact on each main update and on demand.
# This does not publish to or overwrite the production GitHub Pages site.
'on':
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: silsila-erp-pages
  cancel-in-progress: false

jobs:
  build-preview:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Flutter
        uses: subosito/flutter-action@fd55f4c5af5b953cc57a2be44cb082c8f6635e8e
        with:
          flutter-version: '3.29.3'
          channel: stable
          cache: true

      - name: Generate Flutter web files only when missing
        shell: bash
        run: |
          if [ ! -f web/index.html ]; then
            flutter create --project-name=silsila_app --platforms=web .
          else
            echo "Existing web files preserved; no Flutter web template regeneration."
          fi

      - name: Get dependencies
        run: flutter pub get

      - name: Build ERP web preview
        run: flutter build web --release --base-href "/Silsila-App/"

      - name: Save ERP web preview artifact
        uses: actions/upload-artifact@v4
        with:
          name: silsila-erp-web-preview
          path: build/web
          if-no-files-found: error
