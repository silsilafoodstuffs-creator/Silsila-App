name: Silsila GitHub Pages Deployment

on:
  workflow_run:
    workflows:
      - Silsila Web App Validation
    types:
      - completed
    branches: [main]

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

# GitHub Pages allows one active deployment per repository.
# Serialize only deployment; mobile/web/preview test lanes remain independent.
concurrency:
  group: silsila-pages-main
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Download the exact validated Web build
        uses: actions/download-artifact@v4
        with:
          name: silsila-web-build-${{ github.event.workflow_run.run_number }}
          path: build/web
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Verify downloaded Web artifact
        run: |
          set -euo pipefail
          test -s build/web/index.html
          test -s build/web/flutter_bootstrap.js

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Each retry gets its own artifact name. GitHub Pages rejects multiple
          # artifacts with the default name when a deployment job is re-run.
          name: silsila-pages-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/web

      # The Pages artifact upload completes before the Actions artifact-list API
      # becomes consistent. deploy-pages queries that API immediately; without
      # this gate it can incorrectly report "No artifacts named github-pages".
      - name: Wait for GitHub Pages artifact indexing
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          API_URL="${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts?per_page=100"
          for attempt in $(seq 1 24); do
            RESPONSE="$(curl --silent --show-error --fail \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              "${API_URL}")"
            if printf '%s' "${RESPONSE}" | jq -e \
              '.artifacts[]? | select(.name == "silsila-pages-'"${GITHUB_RUN_ID}"'-'"${GITHUB_RUN_ATTEMPT}"'" and .expired == false)' >/dev/null; then
              echo "GitHub Pages artifact is visible to the deployment API."
              exit 0
            fi
            echo "Waiting for Pages artifact indexing (attempt ${attempt}/24)..."
            sleep 5
          done
          echo "ERROR: github-pages artifact was not indexed for this workflow run."
          exit 1

      - name: Publish GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: silsila-pages-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Verify published GitHub Pages responds
        shell: bash
        run: |
          set -euo pipefail
          URL="https://silsilafoodstuffs-creator.github.io/Silsila-App/"
          for attempt in $(seq 1 30); do
            if curl --silent --show-error --fail "$URL" >/dev/null; then
              echo "Published GitHub Pages is responding."
              exit 0
            fi
            sleep 10
          done
          echo "Published GitHub Pages did not respond in time."
          exit 1
