name: Deploy Silsila Web App

'on':
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: silsila-pages
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install Flutter
        uses: subosito/flutter-action@fd55f4c5af5b953cc57a2be44cb082c8f6635e8e
        with:
          flutter-version: '3.29.3'
          cache: true

      - name: Resolve dependencies
        run: flutter pub get

      - name: Analyze Dart source
        run: flutter analyze lib test --no-fatal-infos

      - name: Run automated tests
        run: flutter test

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Build Flutter web app
        run: flutter build web --release --base-href "/Silsila-App/"

      - name: Upload web build
        uses: actions/upload-pages-artifact@v4
        with:
          path: build/web

      - name: Publish to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Smoke test deployed web page
        env:
          DEPLOYED_URL: ${{ steps.deployment.outputs.page_url }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$DEPLOYED_URL"
          curl --fail --silent --show-error --location --retry 8 --retry-delay 5 "$DEPLOYED_URL" -o /tmp/silsila-page.html
          grep -q 'flutter_bootstrap.js' /tmp/silsila-page.html
          grep -q 'سلسلة' /tmp/silsila-page.html
          curl --fail --silent --show-error --location --retry 8 --retry-delay 5 --head "${DEPLOYED_URL%/}/flutter_bootstrap.js"
