name: Silsila Web Preview Deployment

on:
  workflow_run:
    workflows:
      - Silsila Web App Validation
    types:
      - completed
    branches: [main]

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

# GitHub Pages allows one active deployment per repository.
# Serialize only deployment; mobile/web/preview test lanes remain independent.
concurrency:
  group: silsila-pages-main
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Download the exact validated Web build
        uses: actions/download-artifact@v4
        with:
          name: silsila-web-build-${{ github.event.workflow_run.run_number }}
          path: build/web
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Verify downloaded Web artifact
        run: |
          set -euo pipefail
          test -s build/web/index.html
          test -s build/web/flutter_bootstrap.js

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

      - name: Publish Web Preview
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify published Web Preview responds
        shell: bash
        run: |
          set -euo pipefail
          URL="https://silsilafoodstuffs-creator.github.io/Silsila-App/"
          for attempt in $(seq 1 30); do
            if curl --silent --show-error --fail "$URL" >/dev/null; then
              echo "Published Web Preview is responding."
              exit 0
            fi
            sleep 10
          done
          echo "Published Web Preview did not respond in time."
          exit 1
