name: Deploy Silsila Web App

'on':
  workflow_run:
    workflows:
      - Silsila Full Validation - All Recent Changes
    types:
      - completed
    branches: [main]
  workflow_dispatch:

concurrency:
  group: silsila-pages
  cancel-in-progress: false

permissions:
  contents: read
  actions: write
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout validated source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Install Flutter
        uses: subosito/flutter-action@fd55f4c5af5b953cc57a2be44cb082c8f6635e8e
        with:
          flutter-version: '3.29.3'
          cache: true

      - name: Resolve dependencies
        run: flutter pub get

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Build Flutter web app
        run: flutter build web --release --base-href "/Silsila-App/"

      - name: Remove previous Pages artifacts from this run
        uses: actions/github-script@v7
        with:
          script: |
            const { data } = await github.rest.actions.listWorkflowRunArtifacts({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: context.runId,
              per_page: 100,
            });
            for (const artifact of data.artifacts.filter((item) => item.name === 'github-pages')) {
              await github.rest.actions.deleteArtifact({
                owner: context.repo.owner,
                repo: context.repo.repo,
                artifact_id: artifact.id,
              });
              core.info(`Deleted previous Pages artifact ${artifact.id}`);
            }

      - name: Upload web build
        uses: actions/upload-pages-artifact@v4
        with:
          path: build/web

      - name: Publish to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Smoke test deployed web page
        env:
          DEPLOYED_URL: ${{ steps.deployment.outputs.page_url }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$DEPLOYED_URL"
          curl --fail --silent --show-error --location --retry 8 --retry-delay 5 "$DEPLOYED_URL" -o /tmp/silsila-page.html
          grep -q 'flutter_bootstrap.js' /tmp/silsila-page.html
          grep -q 'سلسلة' /tmp/silsila-page.html
          curl --fail --silent --show-error --location --retry 8 --retry-delay 5 --head "${DEPLOYED_URL%/}/flutter_bootstrap.js"

      - name: Install Chromium browser test dependencies
        run: |
          npm install --no-save --no-package-lock playwright
          npx playwright install --with-deps chromium

      - name: Run deployed WebView tests (desktop + mobile)
        env:
          DEPLOYED_URL: ${{ steps.deployment.outputs.page_url }}
        run: node tools/web_view_test.mjs "$DEPLOYED_URL"
