name: One-time strict catalog image import
on:
  push:
    paths:
      - "tools/catalog_import/.run-real-image-import-once"
permissions:
  contents: read
jobs:
  import:
    if: contains(github.event.head_commit.message, 'Run one-time strict catalog image import')
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate strict image matching
        run: |
          python -m py_compile tools/catalog_import/import_real_product_images.py
          python -m unittest discover -s tools/catalog_import -p 'test_*.py' -v
      - name: Import up to 25 strictly matched ERP item photos
        env:
          SUPABASE_URL: https://teitsopmhruczplwlwgn.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SILSILA_ERP_COMPANY_ID: 47278c99-7743-4dd4-9ce6-d11f28e02504
          SILSILA_IMAGE_IMPORT_LIMIT: "25"
          SILSILA_IMAGE_IMPORT_DRY_RUN: "0"
        run: |
          if [ -z "$SUPABASE_SERVICE_ROLE_KEY" ]; then
            echo "::error::SUPABASE_SERVICE_ROLE_KEY is not configured."
            exit 1
          fi
          python tools/catalog_import/import_real_product_images.py
