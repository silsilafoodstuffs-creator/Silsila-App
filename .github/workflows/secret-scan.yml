name: Silsila Secret Scan

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout full history for precise commit-range scan
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan pull request commits for secrets
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --depth=1
          docker run --rm \
            -v "$PWD:/repo" \
            -w /repo \
            ghcr.io/gitleaks/gitleaks:v8.24.2 \
            git --redact=100 --no-banner \
              --gitleaks-ignore-path /repo/.gitleaksignore \
              --report-format json \
              --report-path /repo/gitleaks-report.json \
              --log-opts="origin/main..HEAD" .

      - name: Upload redacted Gitleaks diagnostic report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gitleaks-redacted-report
          path: gitleaks-report.json
          if-no-files-found: warn
          retention-days: 7
