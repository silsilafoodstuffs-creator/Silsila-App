name: Silsila Mobile App Validation

on:
  push:
    branches: [main, 'feature/**']
    paths:
      - "lib/**"
      - "test/**"
      - "integration_test/**"
      - "android/**"
      - "pubspec.yaml"
      - "pubspec.lock"
      - "assets/**"
      - "supabase/**"
      - "tools/catalog_import/**"
      - ".github/workflows/**"
  workflow_dispatch:

permissions:
  contents: read

# Keep each mobile test run independent so a new push never cancels it.
concurrency:
  group: silsila-mobile-validation-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  mobile:
    name: Flutter analyze + tests
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout exact tested commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Set up Flutter
        uses: subosito/flutter-action@fd55f4c5af5b953cc57a2be44cb082c8f6635e8e
        with:
          flutter-version: "3.29.3"
          channel: stable
          cache: true

      - name: Cache Dart and Flutter packages
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: flutter-pub-${{ runner.os }}-${{ hashFiles('pubspec.lock') }}
          restore-keys: |
            flutter-pub-${{ runner.os }}-

      - name: Resolve Flutter dependencies
        run: flutter pub get

      - name: Analyze Dart code
        run: flutter analyze lib test --no-fatal-infos --no-fatal-warnings

      - name: Run complete Flutter test suite
        run: flutter test --reporter expanded

