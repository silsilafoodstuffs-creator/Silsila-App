name: Silsila Mobile App Validation

on:
  push:
    branches: [main]
    paths:
      - "lib/**"
      - "test/**"
      - "integration_test/**"
      - "android/**"
      - "pubspec.yaml"
      - "pubspec.lock"
      - "assets/**"
      - "supabase/**"
      - "tools/catalog_import/**"
  workflow_dispatch:

permissions:
  contents: read

# Keep each mobile test run independent so a new push never cancels it.
concurrency:
  group: silsila-mobile-validation-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  mobile:
    name: Flutter analyze + tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout exact tested commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Set up Python for importer tests
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate catalog image importer
        run: |
          python -m py_compile tools/catalog_import/import_real_product_images.py
          python -m unittest discover -s tools/catalog_import -p 'test_*.py' -v

      - name: Set up Flutter
        uses: subosito/flutter-action@fd55f4c5af5b953cc57a2be44cb082c8f6635e8e
        with:
          flutter-version: "3.29.3"
          channel: stable
          cache: true

      - name: Resolve Flutter dependencies
        run: flutter pub get

      - name: Analyze Dart code
        run: flutter analyze lib test --no-fatal-infos --no-fatal-warnings

      - name: Run complete Flutter test suite
        run: flutter test --reporter expanded

