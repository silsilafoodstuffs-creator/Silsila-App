name: Silsila Mobile App Validation

on:
  pull_request:
    branches: [main]
    paths:
      - "lib/**"
      - "test/**"
      - "integration_test/**"
      - "android/**"
      - "web/**"
      - "pubspec.yaml"
      - "pubspec.lock"
      - "assets/**"
      - "supabase/**"
      - ".github/workflows/**"
  push:
    branches: [main]
    paths:
      - "lib/**"
      - "test/**"
      - "integration_test/**"
      - "android/**"
      - "pubspec.yaml"
      - "pubspec.lock"
      - "assets/**"
      - "supabase/**"
      - "tools/catalog_import/**"
      - ".github/workflows/**"
  workflow_dispatch:

permissions:
  contents: read

# Isolate each commit's validation so later pushes cannot cancel an active test.
concurrency:
  group: silsila-mobile-validation-${{ github.sha }}
  cancel-in-progress: false

jobs:
  mobile:
    name: Analyze, test & build Android Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout exact tested commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Set up Java 17 for Android Gradle
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Cache Gradle dependencies
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@fd55f4c5af5b953cc57a2be44cb082c8f6635e8e
        with:
          flutter-version: "3.29.3"
          channel: stable
          cache: true

      - name: Cache Dart and Flutter packages
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: flutter-pub-${{ runner.os }}-${{ hashFiles('pubspec.lock') }}
          restore-keys: |
            flutter-pub-${{ runner.os }}-

      - name: Generate supported Android platform project when missing
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f android/app/build.gradle.kts ] || [ ! -f android/gradlew ] || [ ! -f android/settings.gradle.kts ]; then
            flutter create --project-name=silsila_app --platforms=android .
          else
            echo "Existing Android project files detected; preserving them."
          fi

      - name: Configure Android NDK version required by plugins
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path("android/app/build.gradle.kts")
          if not p.exists():
              raise SystemExit("Android Gradle Kotlin file was not generated")
          source = p.read_text()
          version = '    ndkVersion = "27.0.12077973"'
          source, replacements = re.subn(r'(?m)^[ \t]*ndkVersion[ \t]*=[^\r\n]*', version, source)
          if replacements == 0:
              marker = "android {"
              if marker not in source:
                  raise SystemExit("Android configuration block not found")
              source = source.replace(marker, marker + "\n" + version, 1)
          p.write_text(source)
          print("Configured Android NDK 27.0.12077973")
          PY

      - name: Resolve Flutter dependencies
        run: flutter pub get

      - name: Analyze Dart code
        id: analyze
        run: flutter analyze lib test --no-fatal-infos --no-fatal-warnings

      - name: Run complete Flutter test suite
        id: test
        run: flutter test --reporter expanded


      # APK is built as an explicit, independently visible validation step.
      - name: Build Android Debug APK
        id: android_debug
        if: always() && !cancelled()
        timeout-minutes: 20
        run: flutter build apk --debug --verbose

      - name: Verify Android APK and calculate SHA-256
        id: verify_android
        if: always() && !cancelled() && steps.android_debug.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          APK="build/app/outputs/flutter-apk/app-debug.apk"
          test -s "$APK"
          unzip -tq "$APK"
          unzip -Z1 "$APK" > /tmp/silsila-apk-entries.txt
          grep -qx 'AndroidManifest.xml' /tmp/silsila-apk-entries.txt
          grep -q 'classes' /tmp/silsila-apk-entries.txt
          sha256sum "$APK" | tee "${APK}.sha256"

      - name: Upload Android Debug APK
        if: always() && !cancelled() && steps.verify_android.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: silsila-android-debug-apk-${{ github.run_number }}
          path: |
            build/app/outputs/flutter-apk/app-debug.apk
            build/app/outputs/flutter-apk/app-debug.apk.sha256
          if-no-files-found: error
          retention-days: 14

      - name: Write Android build result summary
        if: always()
        shell: bash
        run: |
          {
            echo "## Silsila Android APK Validation"
            echo ""
            echo "| Check | Result |"
            echo "|---|---|"
            echo "| Flutter analyze | ${{ steps.analyze.outcome }} |"
            echo "| Flutter tests | ${{ steps.test.outcome }} |"
            echo "| Android Debug APK build | ${{ steps.android_debug.outcome }} |"
            echo "| APK integrity + SHA-256 | ${{ steps.verify_android.outcome }} |"
            echo ""
            echo "A successful APK artifact is attached to this workflow run."
          } >> "$GITHUB_STEP_SUMMARY"
