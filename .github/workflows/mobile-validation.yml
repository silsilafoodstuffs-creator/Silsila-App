name: Silsila Mobile App Validation

on:
  pull_request:
    branches: [main]
    paths:
      - "lib/**"
      - "test/**"
      - "integration_test/**"
      - "android/**"
      - "web/**"
      - "pubspec.yaml"
      - "pubspec.lock"
      - "assets/**"
      - "supabase/**"
      - ".github/workflows/**"
  push:
    branches: [main]
    paths:
      - "lib/**"
      - "test/**"
      - "integration_test/**"
      - "android/**"
      - "pubspec.yaml"
      - "pubspec.lock"
      - "assets/**"
      - "supabase/**"
      - "tools/catalog_import/**"
      - "tools/prepare_android_release.sh"
      - ".github/workflows/**"
  workflow_dispatch:

permissions:
  contents: read

# Keep one current mobile validation per branch.
concurrency:
  group: silsila-mobile-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mobile:
    name: Analyze, test & build signed Android Release APK
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout exact tested commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Set up Java 17 for Android Gradle
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Cache Gradle dependencies
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@fd55f4c5af5b953cc57a2be44cb082c8f6635e8e
        with:
          flutter-version: "3.29.3"
          channel: stable
          cache: true

      - name: Cache Dart and Flutter packages
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: flutter-pub-${{ runner.os }}-${{ hashFiles('pubspec.lock') }}
          restore-keys: |
            flutter-pub-${{ runner.os }}-

      - name: Generate supported Android platform project when missing
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f android/app/build.gradle.kts ] || [ ! -f android/gradlew ] || [ ! -f android/settings.gradle.kts ]; then
            flutter create --project-name=silsila_app --platforms=android .
          else
            echo "Existing Android project files detected; preserving them."
          fi

      - name: Configure Android NDK version required by plugins
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path("android/app/build.gradle.kts")
          if not p.exists():
              raise SystemExit("Android Gradle Kotlin file was not generated")
          source = p.read_text()
          version = '    ndkVersion = "27.0.12077973"'
          source, replacements = re.subn(r'(?m)^[ \t]*ndkVersion[ \t]*=[^\r\n]*', version, source)
          if replacements == 0:
              marker = "android {"
              if marker not in source:
                  raise SystemExit("Android configuration block not found")
              source = source.replace(marker, marker + "\n" + version, 1)
          p.write_text(source)
          print("Configured Android NDK 27.0.12077973")
          PY

      - name: Resolve Flutter dependencies
        run: flutter pub get

      - name: Prepare signed Release APK and Silsila launcher icon
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: bash tools/prepare_android_release.sh

      - name: Analyze Dart code
        id: analyze
        run: flutter analyze lib test --no-fatal-infos --no-fatal-warnings

      - name: Run complete Flutter test suite
        id: test
        run: flutter test --reporter expanded


      # APK is built as an explicit, independently visible validation step.
      - name: Build Android Release APK
        id: android_release
        if: always() && !cancelled()
        timeout-minutes: 25
        run: flutter build apk --release --verbose

      - name: Verify Android APK and calculate SHA-256
        id: verify_android
        if: always() && !cancelled() && steps.android_release.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          APK="build/app/outputs/flutter-apk/app-release.apk"
          test -s "$APK"
          unzip -tq "$APK"
          unzip -Z1 "$APK" > /tmp/silsila-apk-entries.txt
          grep -qx 'AndroidManifest.xml' /tmp/silsila-apk-entries.txt
          grep -q 'classes' /tmp/silsila-apk-entries.txt
          SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          APKSIGNER="$(find "$SDK/build-tools" -name apksigner -type f | sort -V | tail -n 1)"
          OUTPUT="$("$APKSIGNER" verify --verbose --print-certs "$APK")"
          ACTUAL="$(printf '%s\n' "$OUTPUT" | sed -n 's/.*certificate SHA-256 digest: *//Ip' | head -n 1 | tr -d ':' | tr '[:upper:]' '[:lower:]')"
          EXPECTED="a69301fe3009183301d1751aa99ef8d9025c696e2870e4dfb5fd9732be4d8e42"
          test "$ACTUAL" = "$EXPECTED"
          AAPT="$(find "$SDK/build-tools" -name aapt -type f | sort -V | tail -n 1)"
          BADGING="$("$AAPT" dump badging "$APK")"
          printf '%s\n' "$BADGING" | grep -q "application-icon-"
          printf '%s\n' "$BADGING" | grep -q "name='com.example.silsila_app'"
          VERSION_CODE="$(printf '%s\n' "$BADGING" | sed -n "s/.*versionCode='\\([0-9]*\\)'.*/\\1/p")"
          test "$VERSION_CODE" -ge 5
          sha256sum "$APK" | tee "${APK}.sha256"

      - name: Upload Android Release APK
        if: always() && !cancelled() && steps.verify_android.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: silsila-android-release-apk-${{ github.run_number }}
          path: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/flutter-apk/app-release.apk.sha256
          if-no-files-found: error
          retention-days: 14

      - name: Write Android build result summary
        if: always()
        shell: bash
        run: |
          {
            echo "## Silsila Android APK Validation"
            echo ""
            echo "| Check | Result |"
            echo "|---|---|"
            echo "| Flutter analyze | ${{ steps.analyze.outcome }} |"
            echo "| Flutter tests | ${{ steps.test.outcome }} |"
            echo "| Android Release APK build | ${{ steps.android_release.outcome }} |"
            echo "| APK integrity + SHA-256 | ${{ steps.verify_android.outcome }} |"
            echo ""
            echo "A successful APK artifact is attached to this workflow run."
          } >> "$GITHUB_STEP_SUMMARY"
