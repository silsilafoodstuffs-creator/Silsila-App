name: Silsila Web Load Smoke

on:
  workflow_dispatch:
    inputs:
      base_url:
        description: "Public Silsila Web deployment URL"
        required: true
        type: string
        default: "https://silsilafoodstuffs-creator.github.io/Silsila-App"
      virtual_users:
        description: "Conservative concurrent browser-shell clients (maximum 10)"
        required: true
        type: choice
        options:
          - "1"
          - "3"
          - "5"
          - "10"
        default: "3"
      duration:
        description: "Test duration"
        required: true
        type: choice
        options:
          - "30s"
          - "1m"
        default: "30s"

permissions:
  contents: read

concurrency:
  group: silsila-web-load-smoke
  cancel-in-progress: false

jobs:
  web-shell-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout tested revision
        uses: actions/checkout@v4
      - name: Run bounded k6 web-shell smoke test
        env:
          BASE_URL: ${{ inputs.base_url }}
          VUS: ${{ inputs.virtual_users }}
          DURATION: ${{ inputs.duration }}
        run: |
          set -euo pipefail
          case "$BASE_URL" in
            https://*) ;;
            *) echo "Only HTTPS targets are allowed"; exit 1 ;;
          esac
          docker run --rm -i \
            -e BASE_URL="$BASE_URL" \
            -e VUS="$VUS" \
            -e DURATION="$DURATION" \
            grafana/k6:0.54.0 run - < tests/load/silsila_web_smoke.js
