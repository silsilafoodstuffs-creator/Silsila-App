name: silsila_app
description: Silsila wholesale food trading application.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  supabase_flutter: ^2.10.0
  file_picker: ^8.1.7
  image_picker: ^1.1.2
  flutter_secure_storage: ^9.2.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

  assets:
    - assets/images/silsila_splash.png
    - assets/images/silsila_logo.png
    - assets/images/silsila_background.png
    - assets/images/silsila_icon_App.png

  fonts:
    - family: Tajawal
      fonts:
        - asset: assets/fonts/Tajawal.ttf

    - family: Kufam
      fonts:
        - asset: assets/fonts/Kufam.otf

flutter_launcher_icons:
  android: true
  ios: false
  image_path: assets/images/silsila_icon_App.png
  min_sdk_android: 21
  adaptive_icon_background: '#FFFFFF'
  adaptive_icon_foreground: assets/images/silsila_icon_App.png
  remove_alpha_ios: true
