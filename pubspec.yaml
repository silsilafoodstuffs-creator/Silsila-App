name: silsila_app
description: Silsila wholesale food trading application.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  supabase_flutter: ^2.10.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0


flutter:
  uses-material-design: true
  assets:
    - assets/images/silsila_splash.png
    - assets/images/silsila_logo.png
    - assets/images/silsila_background.png
  fonts:
    - family: Tajawal
      fonts:
        - asset: assets/fonts/Kufam.otf

    
