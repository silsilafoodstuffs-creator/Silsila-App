<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=Edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#3E007D">
  <meta name="color-scheme" content="light">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <style>
    html, body { min-height: 100%; background: #F5EFFB; }
    body { margin: 0; overflow: hidden; }
    flt-glass-pane { background: linear-gradient(135deg, #F5EFFB 0%, #FFFFFF 48%, #F9F0FF 100%); }
  </style>
  <meta name="description" content="سلسلة ERP — منظومة متكاملة لإدارة الحسابات والمبيعات والمشتريات والمخازن والموارد البشرية.">
  <meta name="application-name" content="سلسلة ERP">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="apple-touch-icon" href="favicon.svg">
  <title>سلسلة | Silsila ERP</title>
</head>
<body>
  <script>
    // Remove legacy Flutter/PWA caches before boot. A stale service worker can
    // keep serving an older Web bundle after GitHub Pages has deployed new data
    // and application code, especially in mobile browsers.
    (async () => {
      let removedLegacyWorker = false;
      try {
        if ('serviceWorker' in navigator) {
          const registrations = await navigator.serviceWorker.getRegistrations();
          removedLegacyWorker = registrations.length > 0;
          await Promise.all(registrations.map((registration) => registration.unregister()));
        }
      } catch (_) {}
      // Only clear obsolete Flutter caches when a legacy worker was
      // actually registered. Clearing Cache Storage on every launch defeats
      // browser caching and needlessly delays the first Flutter frame.
      if (removedLegacyWorker) {
        try {
          if ('caches' in window) {
            const keys = await caches.keys();
            await Promise.all(keys
              .filter((key) => /flutter|silsila/i.test(key))
              .map((key) => caches.delete(key)));
          }
        } catch (_) {}
      }
      // Unregistering a worker does not detach it from the current document.
      // Reload once so the next navigation is guaranteed to come from the network.
      try {
        if (removedLegacyWorker && sessionStorage.getItem('silsila-legacy-worker-cleared') !== '1') {
          sessionStorage.setItem('silsila-legacy-worker-cleared', '1');
          location.reload();
          return;
        }
        sessionStorage.removeItem('silsila-legacy-worker-cleared');
      } catch (_) {}
      const bootstrap = document.createElement('script');
      bootstrap.src = 'flutter_bootstrap.js?v=__SILSILA_BUILD_VERSION__';
      bootstrap.async = true;
      document.body.appendChild(bootstrap);
    })();
  </script>
</body>
</html>
